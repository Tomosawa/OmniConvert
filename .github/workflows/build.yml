name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test tests/scripts/*.test.mjs
      - run: pnpm typecheck
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs
      - run: pnpm generate
      - name: Package static site
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")
          mkdir -p release-assets
          (cd .output/public && zip -qr "$GITHUB_WORKSPACE/release-assets/OmniConvert_${version}_web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          # Tauri removes the .app after a DMG-only build. Keep it for the smoke test.
        include:
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux dependencies and engines
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg imagemagick pandoc
      - name: Install macOS engines
        if: runner.os == 'macOS'
        run: brew install ffmpeg imagemagick pandoc dylibbundler
      - name: Install Windows engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg imagemagick.app pandoc --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $roots = @('C:\ProgramData\chocolatey\lib', 'C:\Program Files')
          foreach ($engine in @('ffmpeg', 'magick', 'pandoc')) {
            $binary = Get-ChildItem $roots -Recurse -Filter "$engine.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\chocolatey\\bin\\' } |
              Select-Object -First 1
            if (!$binary) { throw "Cannot locate $engine.exe" }
            "SIDECAR_$($engine.ToUpper())=$($binary.FullName)" >> $env:GITHUB_ENV
          }
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs
      - name: Bundle native engine runtime
        run: node scripts/prepare-sidecar-runtime.mjs
      - name: Build installers
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json
        env:
          # Ad-hoc signing; replace with a Developer ID for notarized releases.
          APPLE_SIGNING_IDENTITY: '-'
      - name: Smoke test bundled engines
        run: node scripts/smoke-sidecars.mjs ${{ matrix.target }}
      - name: Collect installers
        run: node scripts/collect-installers.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OmniConvert $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          fi
